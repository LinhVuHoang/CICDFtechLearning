apiVersion: apps/v1
kind: Rollout
metadata:
  name: student-performance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-performance
  template:
    metadata:
      labels:
        app: student-performance
    spec:
      containers:
        - name: student-performance
          image: xenolinhhv/student-performance-prediction:c736869361a76eabad7986fca6d44987c3ae019d
          ports:
            - containerPort: 8000