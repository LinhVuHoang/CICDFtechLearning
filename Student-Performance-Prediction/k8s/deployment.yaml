apiVersion: apps/v1
kind: Rollout
metadata:
  name: student-performance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-performance
  template:
    metadata:
      labels:
        app: student-performance
    spec:
      containers:
        - name: student-performance
          image: xenolinhhv/student-performance-prediction:3cb6ee24e9fea22eaa9b04e727dedb7a7a5655ad
          ports:
            - containerPort: 8000