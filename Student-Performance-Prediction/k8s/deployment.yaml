apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  name: student-performance

spec:
  replicas: 1

  selector:
    matchLabels:
      app: student-performance

  template:
    metadata:
      labels:
        app: student-performance

    spec:
      containers:
        - name: student-performance


          image: xenolinhhv/student-performance-prediction:894003d4ab25e980b63ccc0a30628462daaceb9f

          ports:
            - containerPort: 8000

  strategy:
    canary:
      steps:
        - setWeight: 100