# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

defaults:
  run:
    working-directory: Student-Performance-Prediction

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'Update image to')"
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Start API
      run: |
        #Start Fast API
        uvicorn app:app > app.log 2>&1 &

    - name: Wait for API
      run: |
        # Wait for API to be ready
        for i in {1..30}; do
          if curl -f http://127.0.0.1:8000/docs > /dev/null 2>&1; then
            echo "API is ready"
            exit 0
          fi
          echo "Waiting for API ..."
          sleep 1
        done
        echo "API Failed to start"
        echo "===== API LOG ====="
        cat app.log
        exit 1
    - name: Test API
      run: |
        response=$(curl -s -o response.json -w "%{http_code}" \
          -X POST http://127.0.0.1:8000/ \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -d "gender=male&race_ethnicity=group%20A&parental_level_of_education=master%27s%20degree&lunch=standard&test_preparation_course=completed&reading_score=77&writing_score=78")
    
        echo "HTTP status: $response"

        if [ "$response" != "200" ]; then
          echo "API test failed"
          cat response.json
          cat app.log
          exit 1
        fi
    
        echo "API test passed"
        cat response.json
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    # - name: Test with pytest
    #   run: |
    #     pytest
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build Docker image
      run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/student-performance-prediction:${{ github.sha }} \
            .

    - name: Push Docker image
      run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/student-performance-prediction:${{ github.sha }}

    - name: Update Kubernetes Rollout
      run: |
          sed -i "s|image: .*student-performance-prediction:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/student-performance-prediction:${{ github.sha }}|" k8s/rollout.yaml

    - name: Commit and push manifest
      run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/rollout.yaml
          if git diff --cached --quiet; then
              echo "No manifest changes"
              exit 0
            fi

            git commit -m "Update image to ${{ github.sha }}"
            git push
